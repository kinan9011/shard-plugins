[package]
name = "hash-generator-wasm"
version = "1.0.0"
edition = "2021"
rust-version = "1.90" # usize::is_multiple_of
publish = false

# No wasm-bindgen and no dependencies: plain functions over linear memory (see src/lib.rs).
[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[workspace]
